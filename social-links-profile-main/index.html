<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="./css/links-profile.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <main>
    <section>

      <img src="./assets/images/avatar-jessica.jpeg" alt="jessica avatar" />

      <p>"Front-end developer and avid reader."</p>

      <a class="link" href="https://github.com">GitHub</a>
      <a class="link" href="https://frontendmentor.io">Frontend Mentor</a>
      <a class="link" href="https://linkedin.com">LinkedIn</a>
      <a class="link" href="https://x.com">Twitter</a>

      <div class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
        Coded by <a href="https://github.com/cguttweb">Chloe</a>.

    </section>

</html>
